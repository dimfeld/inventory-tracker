<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventory Order Import</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">⇩</div>
        <div>
          <h1>Order import</h1>
          <p id="site">Checking this page…</p>
        </div>
      </header>

      <button id="extract" type="button">Extract and copy CSV</button>
      <p id="status" role="status" aria-live="polite">
        Open an order history or order details page, then select the button.
      </p>

      <section id="preview" hidden>
        <div class="preview-heading">
          <label for="csv">CSV preview</label>
          <button id="copy" class="secondary" type="button">Copy again</button>
        </div>
        <textarea id="csv" readonly spellcheck="false"></textarea>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
